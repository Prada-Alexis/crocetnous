<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit — CrocEtNous</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .article-page { max-width: 760px; margin: 8rem auto 4rem; padding: 0 6%; }
    .article-page .back {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.85rem; color: var(--text-muted); text-decoration: none;
      margin-bottom: 2rem;
    }
    .article-page .back:hover { color: var(--green-dark); }
    .article-page .meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .article-page .content { line-height: 1.8; }
    .article-page .content p { margin-bottom: 1rem; }
  </style>
</head>
<body>

<nav id="navbar">
  <a href="index.html" class="nav-logo">Croc<span>&</span>Nous</a>
  <ul class="nav-links">
    <li><a href="index.html#pourquoi">Notre démarche</a></li>
    <li><a href="index.html#produits">Produits</a></li>
    <li><a href="index.html#boutique">Boutique</a></li>
    <li><a href="index.html#contact" class="nav-cta">Nous contacter</a></li>
  </ul>
</nav>

<div class="article-page">
  <a href="index.html" class="back">← Retour à l'accueil</a>
  <article id="article"></article>
</div>

<footer>
  <div class="footer-logo">Croc<span>&</span>Nous</div>
  <p>57 rue Jean Moulin, 42300 Roanne &nbsp;·&nbsp; <a href="tel:+33659067506">06 59 06 75 06</a></p>
  <p>© 2026</p>
</footer>

<script src="js/app.js"></script>
<script>
  // Affiche un article depuis data/articles.json selon l'id dans l'URL (?id=...)
  async function renderArticle() {
    const id = new URLSearchParams(location.search).get('id');
    const el = document.getElementById('article');
    if (!el) return;
    try {
      const res = await fetch('data/articles.json');
      const articles = await res.json();
      const a = articles.find(x => String(x.id) === String(id));
      if (!a) { el.innerHTML = '<h2>Article introuvable</h2>'; return; }
      el.innerHTML = `
        <div class="section-label">${a.tags.join(' · ')}</div>
        <h2 class="section-title">${a.title}</h2>
        <div class="meta">${a.date}</div>
        <div class="content">${a.content}</div>`;
    } catch (err) {
      el.innerHTML = '<h2>Impossible de charger l\'article.</h2>';
    }
  }
  renderArticle();
</script>
</body>
</html>
